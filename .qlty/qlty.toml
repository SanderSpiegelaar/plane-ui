config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "clippy"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

# These advisories all arrive through gpui-kit, already the latest release; cargo deny stays the gate.
# Listed by ID so any new advisory still surfaces.
[[triage]]
match.rules = [
  "osv-scanner:RUSTSEC-2024-0384",
  "osv-scanner:RUSTSEC-2024-0436",
  "osv-scanner:RUSTSEC-2025-0134",
  "osv-scanner:RUSTSEC-2026-0192",
  "osv-scanner:RUSTSEC-2026-0206",
  "osv-scanner:RUSTSEC-2026-0370",
  "osv-scanner:RUSTSEC-2026-0371",
  "osv-scanner:RUSTSEC-2026-0372",
]
set.ignored = true
