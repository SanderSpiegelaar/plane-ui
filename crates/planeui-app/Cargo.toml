[package]
name = "planeui-app"
description = "PlaneUI: a form editor for the AeroSpace window manager config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "planeui_app"
path = "src/lib.rs"

[[bin]]
name = "PlaneUI"
path = "src/main.rs"

[dependencies]
planeui-core.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
planeui-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.packager]
product-name = "PlaneUI"
identifier = "dev.spiegelaar.planeui"
binaries = [{ path = "PlaneUI", main = true }]
formats = ["app"]
icons = ["../../packaging/icon-512.png", "../../packaging/icon@2x.png"]
category = "DeveloperTool"
before-packaging-command = "cargo build --release --locked -p planeui-app"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
signing-identity = "-"
