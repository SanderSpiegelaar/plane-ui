config-version = 2

[gaps.inner]
horizontal = 10
vertical = 10

[gaps.outer]
left = 8
bottom = 8
top = 8
right = 8

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
alt-h = 'focus left'
alt-l = 'focus right'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
