[workspace]
resolver = "3"
members = ["crates/planeui-core", "crates/planeui-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
planeui-core = { path = "crates/planeui-core" }
gpui-kit = "=0.8.1"
toml_edit = "0.25.17"
thiserror = "2.0.21"
anyhow = "1.0.104"
log = "0.4.35"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
tempfile = "3.27.0"
insta = "1.49.0"
proptest = "1.12.0"
similar = "3.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
